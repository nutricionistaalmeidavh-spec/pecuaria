name: Pecuaria Certified Windows Release

on:
  push:
    branches:
      - main
      - release/fully-automated-github
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pecuaria-certified-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Mark release start
        shell: pwsh
        run: |
          "ARTISYS_RELEASE_STARTED_AT=$((Get-Date).ToUniversalTime().ToString('o'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Import boundary
        run: npm run check:imports

      - name: Unit and integration tests
        run: npm test

      - name: Web build
        run: npm run build:web

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Browser E2E
        run: npm run qa:web

      - name: Phase 5 functional evidence
        run: npm run qa:surface

      - name: API contract gate
        run: npm run qa:contracts

      - name: Security release gate
        run: npm run qa:security:release

      - name: Product QA gate
        run: npm run qa:product

      - name: Phase 7 fixture cutover
        run: npm run phase7

      - name: Build Windows installer and updater metadata
        run: npm run build:win

      - name: Native release run evidence
        run: npm run qa:release-run
        env:
          GITHUB_ACTIONS: 'true'

      - name: Release validator
        run: npm run qa:release-validator

      - name: Phase 8 certification
        run: npm run phase8:certify

      - name: Verify updater assets
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter 'ArtiSys-Pecuaria-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer missing' }
          if (-not (Test-Path 'release/latest.yml')) { throw 'release/latest.yml missing' }
          if (-not (Test-Path 'qa-artifacts/release-certification.json')) { throw 'release certification missing' }
          Write-Host "Installer: $($installer.Name)"
          Write-Host "SHA256: $((Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match package version v$version" }

      - name: Resolve release publication
        id: publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $publish = 'false'
          $exists = $false

          gh release view $tag --repo "${{ github.repository }}" --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            $exists = $true
          } else {
            $global:LASTEXITCODE = 0
          }

          if ("${{ github.ref }}" -eq 'refs/heads/main' -and -not $exists) {
            $publish = 'true'
          }

          if ("${{ startsWith(github.ref, 'refs/tags/v') }}" -eq 'true' -and -not $exists) {
            $publish = 'true'
          }

          "tag_name=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "publish=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Release tag: $tag | exists=$exists | publish=$publish"

      - name: Upload certified release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pecuaria-certified-${{ github.sha }}
          path: |
            release/ArtiSys-Pecuaria-Setup-*.exe
            release/latest.yml
            release/*.blockmap
            qa-artifacts/*.json
            qa-artifacts/playwright-report
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: steps.publication.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.publication.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/ArtiSys-Pecuaria-Setup-*.exe
            release/latest.yml
            release/*.blockmap
            qa-artifacts/release-certification.json
            qa-artifacts/release-validation.json

      - name: Verify published updater feed
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ steps.publication.outputs.tag_name }}"
          $version = node -p "require('./package.json').version"
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/latest.yml"
          $tmp = Join-Path $env:RUNNER_TEMP 'artisys-pecuaria-latest.yml'
          $ok = $false
          for ($attempt = 1; $attempt -le 15; $attempt++) {
            Remove-Item $tmp -Force -ErrorAction SilentlyContinue
            & curl.exe --fail --location --silent --show-error --output $tmp $url
            if ($LASTEXITCODE -eq 0 -and (Test-Path $tmp)) {
              $content = Get-Content $tmp -Raw
              if ($content -match "version:\s*$([regex]::Escape($version))" -and $content -match "ArtiSys-Pecuaria-Setup-$([regex]::Escape($version))\.exe") {
                $ok = $true
                break
              }
            }
            $global:LASTEXITCODE = 0
            if (-not $ok -and $attempt -lt 15) { Start-Sleep -Seconds 2 }
          }
          if (-not $ok) { throw "Published updater feed is invalid or not propagated: $url" }
          Write-Host "Updater feed verified: $url"
