name: P1 Apply Surface Patch

on:
  push:
    branches: [p1-operational-depth]
    paths:
      - tooling/apply-p1a-surface.mjs
      - tooling/apply-p1a-ui.mjs
      - tooling/apply-p1b-surface.mjs
      - tooling/apply-p1c-surface.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic P1 patch
        shell: bash
        run: |
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          echo "$changed"
          if grep -q '^tooling/apply-p1c-surface.mjs$' <<<"$changed"; then
            node tooling/apply-p1c-surface.mjs
          elif grep -q '^tooling/apply-p1b-surface.mjs$' <<<"$changed"; then
            node tooling/apply-p1b-surface.mjs
          elif grep -q '^tooling/apply-p1a-ui.mjs$' <<<"$changed"; then
            node tooling/apply-p1a-ui.mjs
          else
            node tooling/apply-p1a-surface.mjs
          fi
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose P1 operational surface"
          git push origin HEAD:p1-operational-depth
