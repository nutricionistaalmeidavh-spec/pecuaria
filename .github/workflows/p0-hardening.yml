name: Pecuaria P0-P2 Hardening

on:
  push:
    branches:
      - hardening/pecuaria-p0-p2
      - hardening/reporting-dashboard-p2
      - hardening/reporting-dashboard-p2-integration
      - release/fully-automated-github
      - depth/pecuaria-decision
      - depth/finance-pasture-history
      - depth/reproduction-admin
      - depth/field-mobile-offline
      - p1-operational-depth
      - ui-operational-polish
      - ux-p0-sales-readiness
      - ux-p1-daily-efficiency
      - ux-p2-refinement
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Import boundary
        run: npm run check:imports
      - name: Unit and integration tests
        run: npm test
      - name: Compatibility contract
        run: npm run compat:contract
      - name: Web build
        run: npm run build:web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run qa:web
      - name: Phase 5 functional evidence
        run: npm run qa:surface
      - name: API contract gate
        run: npm run qa:contracts
      - name: Security gate
        run: npm run qa:security
      - name: Product QA gate
        run: npm run qa:product
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pecuaria-p2-qa
          path: |
            qa-artifacts/*.json
            qa-artifacts/playwright-report
          if-no-files-found: warn
