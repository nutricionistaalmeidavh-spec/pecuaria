name: P1 Apply Surface Patch

on:
  push:
    branches: [p1-operational-depth]
    paths:
      - tooling/apply-p1a-surface.mjs
      - tooling/apply-p1a-ui.mjs
      - tooling/apply-p1b-surface.mjs
      - tooling/apply-p1c-surface.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic P1 patch
        run: |
          case "${{ github.event.head_commit.modified }} ${{ github.event.head_commit.added }}" in
            *apply-p1c-surface.mjs*) node tooling/apply-p1c-surface.mjs ;;
            *apply-p1b-surface.mjs*) node tooling/apply-p1b-surface.mjs ;;
            *apply-p1a-ui.mjs*) node tooling/apply-p1a-ui.mjs ;;
            *) node tooling/apply-p1a-surface.mjs ;;
          esac
      - name: Commit generated source changes
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose P1 operational surface"
          git push origin HEAD:p1-operational-depth
